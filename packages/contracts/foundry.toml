[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = false
fuzz = { runs = 512 }
invariant = { runs = 64, depth = 32, fail_on_revert = false }
extra_output = ["abi", "evm.bytecode"]

[fmt]
line_length = 110
tab_width = 4
